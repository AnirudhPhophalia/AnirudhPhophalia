
<svg xmlns="http://www.w3.org/2000/svg" width="850" height="663" viewBox="0 0 850 663">
  <defs>
    <style>
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .header { font-size: 20px; font-weight: 600; fill: #0550ae; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .subheader { font-size: 16px; font-weight: 600; fill: #24292f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .body { font-size: 13px; fill: #57606a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .title { font-size: 14px; font-weight: 600; fill: #0969da; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1px; rx: 6px; ry: 6px; }
      .outerbox { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5px; rx: 12px; ry: 12px; }
    </style>
  </defs>

  <rect class="outerbox" x="1" y="1" width="848" height="661" />

  <!-- TECH STACK -->
  <g transform="translate(30, 30)">
    <text class="header" x="0" y="20">Tech Stack</text>
    <path d="M0,35 L790,35" stroke="#d0d7de" stroke-width="1" />
    
    <g transform="translate(0, 60)">
      <circle cx="10" cy="0" r="5" fill="#e34c26" /><text class="body" x="25" y="4">HTML5/CSS3</text>
      <circle cx="120" cy="0" r="5" fill="#f1e05a" /><text class="body" x="135" y="4">JavaScript</text>
      <circle cx="230" cy="0" r="5" fill="#3178c6" /><text class="body" x="245" y="4">TypeScript</text>
      <circle cx="340" cy="0" r="5" fill="#3572A5" /><text class="body" x="355" y="4">Python</text>
      <circle cx="450" cy="0" r="5" fill="#b07219" /><text class="body" x="465" y="4">Java</text>
      
      <circle cx="10" cy="30" r="5" fill="#41b883" /><text class="body" x="25" y="34">Vue/React/Angular</text>
      <circle cx="160" cy="30" r="5" fill="#000000" /><text class="body" x="175" y="34">Node/Express/Nest</text>
      <circle cx="310" cy="30" r="5" fill="#dd0031" /><text class="body" x="325" y="34">PyTorch/TF/ML</text>
      <circle cx="450" cy="30" r="5" fill="#339933" /><text class="body" x="465" y="34">PostgreSQL/Mongo</text>
    </g>
  </g>

  <!-- FEATURED PROJECTS -->
  <g transform="translate(30, 170)">
    <text class="header" x="0" y="20">Featured Projects</text>
    <path d="M0,35 L790,35" stroke="#d0d7de" stroke-width="1" />
    
    <g transform="translate(0, 50)">
      <!-- Project 1 -->
      <rect class="box" x="0" y="0" width="385" height="100" />
      <text class="title" x="15" y="25">⛵ USV-Segmentation</text>
      <text class="body" x="15" y="45">Semantic segmentation framework built</text>
      <text class="body" x="15" y="60">on MMSegmentation for Unmanned Surface</text>
      <text class="body" x="15" y="75">Vehicle perception.</text>

      <!-- Project 2 -->
      <rect class="box" x="405" y="0" width="385" height="100" />
      <text class="title" x="420" y="25">🧾 InvoiceSnap</text>
      <text class="body" x="420" y="45">AI-powered invoice processing and</text>
      <text class="body" x="420" y="60">management platform for automation and</text>
      <text class="body" x="420" y="75">analytics.</text>

      <!-- Project 3 -->
      <rect class="box" x="0" y="120" width="385" height="100" />
      <text class="title" x="15" y="145">🧠 MAD1 Quiz Master</text>
      <text class="body" x="15" y="165">Interactive quiz platform with time-bound</text>
      <text class="body" x="15" y="180">rounds, scoring, and an interactive UI.</text>

      <!-- Project 4 -->
      <rect class="box" x="405" y="120" width="385" height="100" />
      <text class="title" x="420" y="145">📷 QR Code Generator</text>
      <text class="body" x="420" y="165">Real-time QR code generator supporting</text>
      <text class="body" x="420" y="180">logos and camera input.</text>
    </g>
  </g>

  <!-- CONTACT & VISITOR COUNT -->
  <g transform="translate(30, 480)">
    <text class="header" x="0" y="20">Contact Me</text>
    <path d="M0,35 L790,35" stroke="#d0d7de" stroke-width="1" />
    
    <g transform="translate(0, 60)">
      <text class="subheader" x="0" y="10">📧 anirudhphophalia@gmail.com</text>
      <text class="subheader" x="0" y="40">💼 linkedin.com/in/anirudh-phophalia</text>
      <text class="subheader" x="0" y="70">💬 Discord: anirudhphophalia</text>
    </g>
  </g>

  <g transform="translate(455, 480)">
    <text class="header" x="0" y="20">Visitor Count</text>
    <path d="M0,35 L365,35" stroke="#d0d7de" stroke-width="1" />
    <g transform="translate(0, 60)">
      <text class="body" x="0" y="10">Currently viewing profile dynamic stats.</text>
      <text class="body" x="0" y="30">Thank you for visiting!</text>
    </g>
  </g>
  
</svg>