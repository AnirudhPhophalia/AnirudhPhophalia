name: Generate Breakout Game from GitHub Contributions

on:
  schedule:
    - cron: '0 0 * * 0'  # every Sunday midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Breakout Game
        uses: cyprieng/github-breakout@v1.2.3
        with:
          github_username: AnirudhPhophalia
          github_token: ${{ secrets.GITHUB_TOKEN }}
          enable_ghost_bricks: true
          paddle_color: '#00FFAA'
          ball_color: '#FF0000'
          bricks_colors: '#00FF00,#0000FF,#FF00FF'

      - name: Move generated SVGs
        run: |
          mkdir -p breakout-images
          mv output/light.svg breakout-images/breakout-light.svg
          mv output/dark.svg breakout-images/breakout-dark.svg
          mv output/custom.svg breakout-images/breakout-custom.svg

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push updated Breakout images
        run: |
          git add breakout-images/ || true
          git commit -m "🕹️ Update Breakout contribution game images" || echo "No changes to commit"
          git push origin HEAD:$(git rev-parse --abbrev-ref HEAD) || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
